<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    </head>
    <body class="bg-gray-100 flex items-center justify-center min-h-screen">
        <div class="bg-white rounded-lg shadow-lg p-8 flex flex-col md:flex-row items-center md:items-start">
            <!-- Image Section -->
            <div class="md:w-1/2 flex justify-center">
                <img src="https://storage.googleapis.com/a1aa/image/9Bq83hbXEAjwEFzyRmAUU-RB_WCci8AF9KAfXySW1yE.jpg" 
                     alt="Illustration of a person using a laptop" 
                     width="400" height="400">
            </div>

            <!-- Form Section -->
            <div class="md:w-1/2 mt-8 md:mt-0 md:ml-8">
                <h2 class="text-3xl font-bold mb-4">Login</h2>

<!--                <% if (request.getAttribute("errorMessage") != null) {%>
                <p class="text-red-500"><%= request.getAttribute("errorMessage")%></p>
                <% }%>-->

                <form action="LoginServlet" method="post">
                    <!-- Email Field -->
                    <div class="mb-4">
                        <label for="email" class="block text-gray-700">
                            <i class="fas fa-envelope mr-2"></i> Email
                        </label>
                        <input id="email" name="email" type="email" placeholder="Enter your email" 
                               class="w-full border-b-2 border-gray-300 focus:border-blue-500 outline-none py-2" required>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-4">
                        <label for="password" class="block text-gray-700">
                            <i class="fas fa-lock mr-2"></i> Password
                        </label>
                        <input id="password" name="password" type="password" placeholder="Enter your password" 
                               class="w-full border-b-2 border-gray-300 focus:border-blue-500 outline-none py-2" required>
                    </div>

                    <!-- Remember Me Checkbox -->
                    <div class="mb-4 flex items-center">
                        <input id="remember" type="checkbox" class="mr-2">
                        <label for="remember" class="text-gray-700">Remember me</label>
                    </div>

                    <!-- Submit Button -->
                    <!-- Submit Button -->
                    <div class="mb-4">
                        <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600">
                            Log in
                        </button>
                    </div>

                    <!-- Dashboard Link -->
                    

                    <!-- Sign Up Link -->
                    <div class="text-center mb-4">
                        <a href="register.jsp" class="text-blue-500">Create an account</a>
                    </div>

                    <!-- Social Media Login -->
                    <div class="text-center">
                        <p class="text-gray-700 mb-2">Or login with</p>
                        <div class="flex justify-center space-x-4">
                            <a href="#" class="text-blue-700"><i class="fab fa-facebook-f"></i></a>
                            <a href="#" class="text-blue-400"><i class="fab fa-twitter"></i></a>
                            <a href="#" class="text-red-500"><i class="fab fa-google"></i></a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
